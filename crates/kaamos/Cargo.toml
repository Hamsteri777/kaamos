[package]
name = "kaamos"
description = "Linux desktop helpers for Slint apps: Wayland app id and activation token, ksni tray, autostart, XDG paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["tray"]
# StatusNotifierItem tray icon (KDE, most Linux panels) via ksni.
tray = ["dep:ksni"]

[dependencies]
slint.workspace = true
ksni = { workspace = true, optional = true }
